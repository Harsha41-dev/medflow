spring:
  application:
    name: medflow

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medflow}
    username: ${SPRING_DATASOURCE_USERNAME:medflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:medflow_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

app:
  api:
    base-path: /api/v1
  registration:
    public-default-role: PATIENT
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-long-development-secret-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ml-service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${ML_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_SERVICE_READ_TIMEOUT_MS:5000}
  demo:
    seed-enabled: ${DEMO_DATA_SEED_ENABLED:false}

logging:
  level:
    org.springframework.security: INFO
